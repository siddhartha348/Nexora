services:
  - type: web
    name: nexora-app
    env: python
    buildCommand: "cd frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt"
    startCommand: "cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.12.0
      - key: ENVIRONMENT
        value: production
      - key: APP_NAME
        value: "NEXORA Brand Governance"
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "120"
      - key: GEMINI_API_KEY
        sync: false
      - key: DEFAULT_AI_PROVIDER
        value: gemini
      - key: MOCK_LLM
        value: "false"
